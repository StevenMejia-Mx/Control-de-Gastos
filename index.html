<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css">
    <title>Control de Gastos</title>
  </head>
  <body>

    <header>
      <h1>Control de gastos </h1>
      <p>Registra tus gastos y lleva un control </p>
    </header>

    <main>
      <section class="tarjeta">

        <h2>Formulario</h2>

        <form id="formulario" novalidate>
          <div class="campo">
            <label for="concepto">Concepto: </label>
            <input type="text" id="concepto" placeholder="Comida en restaurante">
          </div>

          <div class="campo">
            <label for="monto">Monto: $</label>
            <input type="number" id="monto" step="0.01" min="0" placeholder="0.00">
          </div>

          <div class="campo">
            <label for="categoria">Categoría: </label>
            <select id="categoria">
              <option value="">Selecciona</option>
              <option value="comida">Comida</option>
              <option value="transporte">Transporte</option>
              <option value="escuela">Escuela</option>
              <option value="servicios">Servicios</option>
              <option value="otros">Otros</option>
            </select>
          </div>

          <div class="campo">
            <label for="fecha">Fecha: </label>
            <input type="date" id="fecha">
          </div>

          <p id="mensaje" class="mensaje"></p>

          <div class="botones">
            <button type="submit" id="btn-guardar" class="btn btn-primario">Guardar</button>
            <button type="button" id="btn-cancelar" class="btn btn-secundario" hidden>Cancelar</button>
          </div>

        </form>

      </section>
      <section class="tarjeta">

        <h2>Lista</h2>
        <div class="resumen">
            <div>
              <span class="etiqueta">Total gastado: </span>
              <strong id="total">$0.00</strong>
            </div>
            <div>
              <span class="etiqueta">Registros: </span>
              <strong id="contador">0</strong>
            </div>
        </div>

        <div class="filtros">
          <div class="campo filtro-buscar">

            <label for="buscar">Buscar: </label>
            <input type="search" id="buscar" placeholder="Buscar por concepto">
          
          </div>
          <div class="campo filtro-categoria">

            <label for="filtrar">Filtrar: </label>
            <select id="filtrar">
              <option value="todas">Todas</option>
              <option value="comida">Comida</option>
              <option value="transporte">Transporte</option>
              <option value="escuela">Escuela</option>
              <option value="servicios">Servicios</option>
              <option value="otros">Otros</option>
            </select>

          </div>
        </div>

        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Conceptos</th>
                <th>Categoría</th>
                <th>Monto</th>
                <th>Acciones</th>
              </tr>
            </thead>
            
            <tbody id="lista-gastos"></tbody>

          </table>
        </div>
        
        <p id="sin-registros" class="sin-registros">Aún no hay gastos registrados.</p>
      </section>
    </main>

    <script src="js/script.js"></script>

  </body>
</html>
